info:
  name: Webhook
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/webhooks/pluggy"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "event": "item/updated",
        "eventId": "evt-123",
        "itemId": "your-pluggy-item-id"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
