info:
  name: Sync Item
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/open-finance/sync"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "itemId": "your-pluggy-item-id",
        "institutionName": "Nubank"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
